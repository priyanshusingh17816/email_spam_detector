<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Email Spam Detector</h1>
        <p>Paste an email message and check whether it is spam.</p>

        <form method="POST">
            <textarea name="email" placeholder="Enter email text here..." required>{{ email }}</textarea>
            <button type="submit">Check Email</button>
        </form>

        {% if result %}
            <div class="result {{ 'spam' if result == 'SPAM' else 'safe' }}">
                Result: <strong>{{ result }}</strong>
            </div>
        {% endif %}
    </div>
</body>
</html>
